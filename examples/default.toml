background = "transparent"
theme = "gruvbox-material"

[layout]
direction = "horizontal"
gap = 1

[layout.first]
image = "builtin"
size = "35%"

[layout.second]
direction = "vertical"
size = "fill"
swatches = true

[[layout.second.modules]]
components = ["os", "hostname", "kernel", "uptime", "shell"]
title = "System"

[[layout.second.modules]]
components = ["cpu", "cpu_cores", "memory"]
title = "Hardware"
